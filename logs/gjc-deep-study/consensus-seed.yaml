# ooo-style frozen seed — jeo-code gjc-parity improvement  (rev 2, post-consensus)
# Source analysis: logs/gjc-deep-study/{gjc-source-inventory,jeo-code-inventory,diff-classification}.md
#                  + logs/gjc-deep-study/runtime/runtime-observations.md
# Consensus: architect 12-ArchSeedConsensus (concept-safe; grounding-drift fixes applied)
#            critic   13-CriticSeedConsensus (ITERATE; 7 required fixes applied below)
# Status: DRAFT pending USER approval. This is a PLAN. No product source is edited until approved.
# Sync to ooo when approved:  joc ooo-seed   (writes .ouroboros immutable seed)

goal: >
  Close the highest-value gjc capability gaps in jeo-code while preserving its concept —
  pure-TypeScript on Bun with ZERO native dependencies, single-binary compile, the
  evolution-forge TUI identity, and the frozen method (deep-interview → ralplan →
  ultragoal + team; executor/planner/architect/critic). Take missing feature/usability
  behavior from gjc; improve token-efficiency and startup/scan performance using only Bun
  primitives and pure-JS libraries; never adopt a mandatory native (.node) layer.

constraints:
  - "Pure-TS Bun, zero native dependencies — no .node/FFI, no node-pty; keep `bun build --compile` single-binary green."
  - "Runtime deps stay minimal; any new dep must be pure-JS and justified (prefer Bun built-ins)."
  - "Preserve the evolution-forge identity (ascii art, forge boxes, 5 stages, themes) and the 4+4 method; do NOT import gjc's crustacean-only branding or sprawling subsystem zoo (red-claw/blue-crab stay as themes, not the brand)."
  - "Preserve the pass-888/889 inline-scrollback contract: EL-only mid-turn erases, DECSET 2026 atomic flush, no ledger duplication, JOC_TUI_ALT_SCREEN=1 fallback."
  - "Every change ships with focused unit tests; `bun run typecheck` = 0 and `bun test` green; user-visible items add a real-surface (tmux) check."
  - "Native-perf parity (brush shell, AST/grep/sixel/diff natives) is a NON-goal; approximate behavior via pure-JS or OPTIONAL PATH shell-out, never a required binary."
  - "Phased delivery; each phase independently shippable/reviewable; stop at pending approval before implementation."

# Intra-phase ordering (critic structural fix #6 — dependencies are real, not cosmetic)
ordering:
  P1: "B1 before B3 (cost needs accurate token counts at the decision boundary)."
  P2: "B9 before B7 and B8 (box/table alignment needs correct width math)."
  P3: "independent; B15 may ship first (highest robustness value)."

acceptance_criteria:
  # ---- Phase 1 — concept-safe, high-ROI (token-efficiency + usability) ----
  - "P1.B1 token accounting [token-efficiency, not CPU-perf]: compaction trigger + `ctx%` use a real
     tokenizer (pure-JS js-tiktoken or gpt-tokenizer; cl100k_base for Claude/GPT-4, o200k_base for
     o-series, nearest-family fallback). PERF GUARD: lazy-load the encoder once, MEMOIZE per-message
     counts, keep the cheap char-heuristic for the per-FRAME footer ctx% and use accurate counts only
     at the compaction decision boundary. Pass: accurate path within ±5% of provider-reported usage on
     a fixture; footer render shows no measurable per-frame regression. (touch: agent/compaction.ts:33-55,
     consumer tui/components/footer.ts)"
  - "P1.B2 output minimizer [perf/usability]: in addition to the EXISTING head/tail truncate + spill
     pointer (engine.ts:162-376 — keep the current `[raw: <path>]` pointer; do NOT build an artifact://
     resolver, jeo has none), add a TEST-RUNNER NOISE FILTER: strip individual passing-test lines from
     bun-test/jest/vitest/cargo-test output, keeping failures, summary counts, and compiler diagnostics;
     detection by output heuristic (✓/PASS/ok line patterns), not by command name; rules live in a
     runner-pattern registry. Pass: unit-tested on a noisy bun-test fixture (passes stripped, failures+
     summary kept)."
  - "P1.B3 cost accounting [usability]: HUD/summary shows live `$` cost = static per-model price table
     (`$/1M` input+output) maintained in source beside model-catalog.ts (initial: Anthropic Claude,
     OpenAI GPT/o-series, Gemini); UNKNOWN model → token count only, never a fabricated cost; plus a
     `(sub)` marker during subagent turns. Pass: unit-tested with a price fixture incl. an unknown-model
     row. (depends on B1)"
  - "P1.B5 git dirty-flag [ui-ux]: status shows `⑂ <branch> ?N` uncommitted count via
     `git status --porcelain` line count, cached per turn start (no per-render subprocess). Pass: unit
     test with a mocked git surface; tmux check shows `?N`. (touch: footer.ts + launch.ts branch detect)"
  - "P1.B11 retry fail-fast config [usability — REMAINDER ONLY]: the retry BUDGET (request/stream/max +
     maxDelay) already ships (state.ts:53-64 Config.retry → ai/model-manager.ts:144-177 resolveRetryOptions,
     tested). Net-new = config-driven fail-fast/non-retryable CLASS overrides + documenting the existing
     budget surface. Pass: unit-tested class-override resolution. (correct touch: ai/model-manager.ts, NOT retry.ts)"
  - "P1.B12 slash position counter [ui-ux — REMAINDER ONLY]: per-command descriptions + paginated overflow
     already ship (slash.ts formatSlashPreview, tested). Net-new = add an `(i/total)` position counter to
     the preview. Pass: extend slash.test.ts for the counter."
  # ---- Phase 2 — UX depth + workspace perf (still pure-TS) ----
  - "P2.B4 turn-title [ui-ux/usability]: derive a turn title with NO extra LLM call — title = first user
     message of the turn truncated to 50 chars; if the model's first tool invocation yields a clearer
     verb+target (e.g. `Read package.json`) prefer that. Render in the HUD AND sync to the tmux pane
     title under --tmux (`joc: <title>`). Pass: unit test for derivation; tmux capture shows pane title."
  - "P2.B6 workspace scan [perf]: replace the multiple readdir walks (context-files.ts) with ONE cached
     startup walk (Bun.Glob) yielding tree + AGENTS.md candidates, with explicit invalidation. Pass:
     measured fewer FS passes than current on a fixture tree; invalidation unit-tested."
  - "P2.B7 tool-result card [ui-ux]: align the forge box with gjc (command echo `$ <cmd>`, `Output`
     divider, `⟦Timeout: Ns⟧` annotation) WITHOUT breaking inline scrollback. Pass: snapshot test +
     inline-scrollback regression (see verification). (depends on B9)"
  - "P2.B8 markdown tables [ui-ux]: render assistant markdown tables as box-drawn tables in the TUI
     (parser: `marked`, pure-JS). Pass: unit-tested renderer on a table fixture. (depends on B9)"
  - "P2.B9 width/wrap [ui-ux]: ANSI+CJK+emoji+tab-aware width/truncate/wrap helpers replace ad-hoc
     truncate(). Pass: property-tested on CJK/emoji/tab fixtures with zero SGR spill."
  # ---- Phase 3 — opt-in breadth via pure-JS / shell-out (concept-guarded) ----
  - "P3.B15 compaction hardening [usability — promoted: highest robustness value]: replace the lossy
     placeholder (compaction.ts:243) with a DEGRADATION LADDER: (1) retry summary call up to 2× with
     backoff; (2) on persistent failure keep the N most-recent messages verbatim and drop oldest (never
     replace-all with a placeholder); (3) log + surface `summaryFailed` to the HUD. Pass: failure-injection
     test (mock callLlm to throw) asserts recent history is retained."
  - "P3.B10 bash fixups [usability]: opt-in conservative pre-exec rewrite pass (TS) that NEVER changes
     intent. Initial ≥5 documented rules, each with a before/after fixture, e.g.: (1) `cat f | grep p`
     → `grep p f`; (2) merge `2>&1` when stderr is read; (3) `cd d && cmd` → cmd with cwd; (4) quote
     glob-unsafe paths; (5) `find . -name x` passthrough guard. Pass: fixup test matrix; off by default."
  - "P3.B14 kill-ring [ui-ux/usability]: emacs kill/yank in the REPL editor (C-k, C-y, M-y). Pass:
     keybinding unit tests."
  - "P3.C2/C1 optional accelerators [feature]: keep pure-Bun search/AST as the ALWAYS-present primary;
     if `rg`/`ast-grep` exist on PATH use them as an internal accelerator UNDER THE SAME TOOL NAME (do
     NOT add/remove tools by machine — keeps session replay deterministic); surface availability in
     /tools. Pass: both present and absent paths unit-tested."

