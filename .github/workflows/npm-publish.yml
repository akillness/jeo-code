name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run instead of publishing"
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Check package contents
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack-manifest.json
          cat > pack-check.mjs <<'EOF'
          import { readFileSync } from "node:fs";
          import { execSync } from "node:child_process";

          const manifest = JSON.parse(readFileSync("pack-manifest.json", "utf8"));
          const packedFiles = manifest[0].files.map((f) => f.path);

          const tracked = new Set(
            execSync("git ls-files", { encoding: "utf8" }).trim().split("\n"),
          );

          // Untracked/leaked local scratch files must never ship in the published
          // tarball. These three previously leaked in because npm pack --dry-run
          // was only printed, never asserted against the tracked file set.
          const forbidden = [
            "src/agent/monitor-registry.ts",
            "src/agent/monitor-tool.ts",
            "src/types/playwriter.d.ts",
          ];

          const required = [
            "package.json",
            "src/cli.ts",
            "src/ai/model-discovery.ts",
            "src/ai/providers/openai.ts",
            "CHANGELOG.md",
            "README.md",
            "README.ko.md",
            "README.ja.md",
            "README.zh.md",
          ];

          const errors = [];

          for (const path of packedFiles) {
            if (!tracked.has(path)) {
              errors.push(`untracked path leaked into npm package: ${path}`);
              continue;
            }
            if (forbidden.includes(path)) {
              errors.push(`forbidden dev/runtime artifact packed: ${path}`);
            }
            if (
              /(^|\/)(test|tests)\//.test(path) ||
              /\.test\.ts$/.test(path) ||
              /^\.github\//.test(path)
            ) {
              errors.push(`test/CI artifact leaked into npm package: ${path}`);
            }
          }

          const packedSet = new Set(packedFiles);
          for (const path of required) {
            if (!packedSet.has(path)) {
              errors.push(`required release file missing from npm package: ${path}`);
            }
          }

          if (errors.length > 0) {
            console.error("npm pack content check failed:");
            for (const e of errors) console.error(`  - ${e}`);
            process.exit(1);
          }

          console.log(
            `npm pack content check passed (${packedFiles.length} tracked files; required release files present; no forbidden or test/CI artifacts).`,
          );
          EOF
          node pack-check.mjs
          rm -f pack-manifest.json pack-check.mjs

      - name: Verify npm token
        run: |
          npm whoami --registry https://registry.npmjs.org/ >/dev/null || {
            echo "::error title=NPM_TOKEN is not publish-capable::Set NPM_TOKEN to an npm Automation token or a granular token with publish/read-write permission and 2FA bypass for publishing."
            exit 1
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry-run publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run --access public --registry https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check if this version is already on npm
        id: check_published
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip publish (version already on npm)
        if: ${{ steps.check_published.outputs.already_published == 'true' }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "::notice title=npm publish skipped::jeo-code@${PKG_VERSION} is already on the registry (published outside this workflow run, or a prior attempt already succeeded) — nothing to publish."

      - name: Publish to npm
        id: publish
        if: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && steps.check_published.outputs.already_published != 'true' }}
        run: npm publish --access public --registry https://registry.npmjs.org/ --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Explain npm permission failures
        if: ${{ failure() && steps.publish.outcome == 'failure' }}
        run: |
          echo "::error title=npm publish permission failure::If npm returned E403 about 2FA, replace NPM_TOKEN with an npm Automation token or a granular token that has package publish/read-write permission and 'bypass 2FA for publishing' enabled."
          exit 1

  release-binaries:
    name: Build standalone binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # jeo has no native addons, so every release target (including the
      # win32-x64 .exe) cross-compiles from this single Linux runner.
      - name: Build all release binaries
        run: bun run build:binaries --targets all

      - name: List built binaries
        run: ls -lh dist/

      - name: Upload binaries as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jeo-binaries
          path: dist/jeo-*
          if-no-files-found: error

      - name: Attach binaries to the GitHub release
        if: ${{ github.event_name == 'release' }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/jeo-* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
