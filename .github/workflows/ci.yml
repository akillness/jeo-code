name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: bun test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run smoke suite
        run: bun test
      - name: Link the CLI globally
        run: |
          bun link
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Run the installed CLI
        run: |
          jeoc --version
          jeoc help
