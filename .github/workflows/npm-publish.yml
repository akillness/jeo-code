name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run instead of publishing"
        type: boolean
        default: false
      ref:
        description: "Exact git ref (sha, branch, or tag) to run on"
        type: string
        required: true
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Manual dispatches should run against the explicitly requested git ref.
          ref: "${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}"
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Trusted publishing (OIDC): npm trusts this repo/workflow directly, so no
      # NPM_TOKEN secret exists to expire, leak, or need a 2FA bypass (npm restricts
      # bypass-2FA tokens from Aug 2026 and ends direct publishing with them in
      # Jan 2027). Requires npm >= 11.5.1 and `permissions.id-token: write` above.
      # One-time setup on npmjs.com: package jeo-code -> Settings -> Trusted
      # Publisher -> GitHub Actions, owner akillness, repo jeo-code, workflow
      # npm-publish.yml, environment left blank.
      - name: Setup Node for npm publish
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Provision Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser hard gate
        run: bun run verify:browser

      - name: Typecheck
        run: bun run typecheck

      # Two processes on purpose. Chromium launch/teardown inside the same `bun test`
      # process intermittently starved the FIRST later `Bun.spawn` of the CLI (it
      # exited 0 with empty stdout; reproducible only with the browser tests in-process,
      # never standalone). Isolating keeps every test running and makes a failure
      # attributable to one step.
      - name: Test (everything except the browser tool)
        env:
          JEO_SKIP_BROWSER_TESTS: "1"
        run: bun test

      - name: Test the browser tool with Chromium required
        env:
          JEO_REQUIRE_BROWSER: "1"
        run: bun test test/browser-tool.test.ts

      - name: Check package contents
        run: bun run pack:check

      - name: Smoke-test the packed tarball
        run: |
          set -euo pipefail
          # `pack:check` proves the tarball's import graph resolves on paper. This
          # step proves it BOOTS: unpack the real tarball and import the launch
          # entrypoint, the module graph a plain `jeo` / `jeo --tmux` run pulls in.
          # Releases 0.9.3-0.9.6 published a package whose `jeo` crashed instantly
          # (`Cannot find module '../agent/monitor-tool'`) because nothing ever
          # executed the artifact. Declared third-party deps come from the already
          # installed node_modules, so this isolates PACKAGE-INTERNAL resolution.
          SMOKE="$(mktemp -d)"
          TARBALL="$(npm pack --silent --pack-destination "$SMOKE")"
          tar -xzf "$SMOKE/$TARBALL" -C "$SMOKE"
          ln -s "$PWD/node_modules" "$SMOKE/package/node_modules"
          bun -e '
            const pkg = process.argv[1];
            await import(pkg + "/src/cli/runner.ts");
            await import(pkg + "/src/commands/launch.ts");
            console.log("packed tarball boots: cli runner + launch module graph loaded");
          ' "$SMOKE/package"
          rm -rf "$SMOKE"

      - name: Verify trusted-publishing prerequisites
        run: |
          set -euo pipefail
          NPM_VER="$(npm --version)"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error("::error title=npm too old::npm >= 11.5.1 is required for trusted publishing (found " + process.argv[1] + ")");
              process.exit(1);
            }
          ' "$NPM_VER"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error title=OIDC unavailable::This job needs permissions.id-token: write so npm can verify the GitHub OIDC token."
            exit 1
          fi

      - name: Dry-run publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run --access public --registry https://registry.npmjs.org/

      # Non-dry manual dispatch and released events are the only publish path.
      - name: Check if this version is already on npm
        id: check_published
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip publish (version already on npm)
        if: ${{ steps.check_published.outputs.already_published == 'true' }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "::notice title=npm publish skipped::jeo-code@${PKG_VERSION} is already on the registry (published outside this workflow run, or a prior attempt already succeeded) — nothing to publish."

      # This is the only step that actually publishes a non-dry workflow event.
      - name: Publish to npm
        id: publish
        if: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && steps.check_published.outputs.already_published != 'true' }}
        run: npm publish --access public --registry https://registry.npmjs.org/ --provenance

      - name: Explain npm permission failures
        if: ${{ failure() && steps.publish.outcome == 'failure' }}
        run: |
          echo "::error title=npm publish was rejected::An E404/E403 here usually means npmjs.com has no Trusted Publisher for this workflow. On npmjs.com open package jeo-code -> Settings -> Trusted Publisher -> GitHub Actions and enter owner 'akillness', repository 'jeo-code', workflow filename 'npm-publish.yml' (environment blank). No NPM_TOKEN secret is used by this workflow."
          exit 1

  release-binaries:
    name: Build standalone binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Dry-run workflow_dispatch is check-only; build/upload binaries only for publish-capable runs.
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Manual dispatches should run against the explicitly requested git ref.
          ref: "${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}"
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # jeo has no native addons, so every release target (including the
      # win32-x64 .exe) cross-compiles from this single Linux runner.
      - name: Build all release binaries
        run: bun run build:binaries --targets all

      - name: List built binaries
        run: ls -lh dist/

      - name: Upload binaries as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: jeo-binaries
          path: dist/jeo-*
          if-no-files-found: error

      - name: Attach binaries to the GitHub release
        if: ${{ github.event_name == 'release' }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/jeo-* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
