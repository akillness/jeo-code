non_goals:
  - "Vendored Rust shell (brush), PtySession/native PTY, or any .node native acceleration (node-pty included)."
  - "Per-ISA prebuilt binaries; jeo-code has no native layer by design."
  - "LSP tool, DAP debugger, browser automation (puppeteer), STT/SSH/secrets/vim-mode, memories/hindsight."
  - "RPC/ACP/bridge remote-control modes (MCP already covers external integration)."
  - "Harness control plane, agentic-commit pipeline, stats React dashboard, pi-iso overlay isolation."
  - "PTY/interactive-shell parity — Bun has no native pseudo-terminal; node-pty would break zero-native-deps. Deferred."
  - "SIXEL inline images, web scrape, hashline native diff, JS/Python eval kernels — deferred (C-tier), revisit only if demanded."
  - "Crustacean rebrand — evolution-forge identity stays."

prioritization:
  performance:  ["B1 tokenizer (less wasteful compaction)", "B2 minimizer (fewer tokens)", "B6 one-pass scan", "B9 width → fewer re-renders"]
  usability:    ["B3 cost", "B5 dirty-flag", "B11 fail-fast classes", "B12 slash counter", "B10 fixups", "B15 compaction safety"]
  ui_ux:        ["B4 turn-title + pane-title", "B7 tool card", "B8 tables", "B9 width/wrap", "B14 kill-ring"]
  feature:      ["C2 rg accelerator", "C1 ast-grep accelerator"]
  deferred:     ["PTY", "eval kernels", "web scrape", "SIXEL", "hashline diff", "LSP/DAP", "browser", "stats SPA"]

verification:
  global: ["bun run typecheck = 0", "bun test green", "no new runtime native dep; bun build --compile stays green"]
  per_phase:
    P1: "bun test only (no tmux): B1 tokenizer fixture (±5%), B2 noisy-output fixture, B3 price fixture (+unknown row), B5 git mock, B11 class-override resolution, B12 slash counter."
    P2: "bun test: B6 FS-pass count, B8 table renderer, B9 width property tests. Tmux capture: B4 pane title, B5 `?N`, B7 forge card + scrollback preservation."
    P3: "bun test: B10 fixup matrix, B14 keybindings, B15 failure injection, C1/C2 PATH present+absent."
  inline_scrollback_regression: >
    Each phase: after a multi-tool turn, `tmux capture-pane -p -S -200` must confirm (a) alternate_on=0,
    (b) ledger lines present in scrollback, (c) no ED (\x1b[0J) / 3J in the mid-turn output stream.
    Reuse logs/qa-inline-scrollback/runner.sh as the documented regression protocol (manual smoke + the
    6 automated cases). UX items also get an executor QA/red-team lane.
  gates: ["architect all-CLEAR + APPROVE per phase", "executor QA/red-team on user-visible surfaces", "inline-scrollback regression each phase"]
