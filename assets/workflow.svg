<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Jeo Claw Multi-Agent Autonomous Engineering Workflow</title>
  <desc id="desc">Orchestrated multi-agent pipeline: PD Claw (Requirements), AI Claw (Plan &amp; Critic), Engine Claw (Parallel Execution), News Claw (Monitoring &amp; Telemetry), and Zero Claw (Verification &amp; Merge).</desc>
  
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e"/>
      <stop offset="50%" stop-color="#0b1426"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="pdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132438"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1a3a"/>
      <stop offset="100%" stop-color="#111026"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1828"/>
      <stop offset="100%" stop-color="#190e1c"/>
    </linearGradient>
    <linearGradient id="newsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#122830"/>
      <stop offset="100%" stop-color="#0a1920"/>
    </linearGradient>
    <linearGradient id="zeroGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e24"/>
      <stop offset="100%" stop-color="#0c1c16"/>
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="460" rx="24" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Banner -->
  <g transform="translate(50, 42)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.5px">
      JEO CLAW <tspan fill="#ff5252">SWARM</tspan> WORKFLOW
    </text>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Autonomous Multi-Agent Pipeline · Spec-First Engineering · Continuous Verification Gate
    </text>
    <g transform="translate(880, -12)">
      <rect width="220" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="16" r="5" fill="#10b981"/>
      <text x="32" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">5 Specialized Claw Agents</text>
    </g>
  </g>

  <!-- Connecting Flow Lines (Behind Cards) -->
  <g fill="none" stroke-width="2.5">
    <path d="M 260 250 L 290 250" stroke="#38bdf8" stroke-dasharray="4,4"/>
    <path d="M 490 250 L 520 250" stroke="#a855f7" stroke-dasharray="4,4"/>
    <path d="M 720 250 L 750 250" stroke="#ec4899" stroke-dasharray="4,4"/>
    <path d="M 950 250 L 980 250" stroke="#2dd4bf" stroke-dasharray="4,4"/>
  </g>

  <!-- ==================== STAGE 1: PD CLAW ==================== -->
  <g transform="translate(50, 110)">
    <rect width="210" height="280" rx="18" fill="url(#pdGrad)" stroke="#38bdf8" stroke-width="1.8" filter="drop-shadow(0 8px 16px rgba(56, 189, 248, 0.12))"/>
    <circle cx="34" cy="34" r="16" fill="#0284c7" opacity="0.3"/>
    <text x="34" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">📋</text>
    <text x="60" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f0f9ff">PD Claw</text>
    <text x="60" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="0.5px">PRODUCT DIRECTOR</text>
    
    <!-- Role Divider -->
    <line x1="20" y1="66" x2="190" y2="66" stroke="#1e3a5f" stroke-width="1"/>

    <!-- Highlights & Tasks -->
    <g font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
      <text x="20" y="94" font-weight="700" fill="#7dd3fc">Phase 1: Spec Intake</text>
      <text x="20" y="122">• Socratic Interview</text>
      <text x="20" y="146">• Ambiguity Refusal Gate</text>
      <text x="20" y="170">• User Story &amp; Scope</text>
      <text x="20" y="194">• PRD Seed Freezing</text>
    </g>

    <!-- Command Pill -->
    <rect x="16" y="230" width="178" height="34" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="105" y="252" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">jeo deep-interview</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(262, 243)">
    <polygon points="0,0 12,7 0,14" fill="#38bdf8"/>
  </g>

  <!-- ==================== STAGE 2: AI CLAW ==================== -->
  <g transform="translate(280, 110)">
    <rect width="210" height="280" rx="18" fill="url(#aiGrad)" stroke="#c084fc" stroke-width="1.8" filter="drop-shadow(0 8px 16px rgba(192, 132, 252, 0.12))"/>
    <circle cx="34" cy="34" r="16" fill="#7e22ce" opacity="0.3"/>
    <text x="34" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🧠</text>
    <text x="60" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#faf5ff">AI Claw</text>
    <text x="60" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c084fc" letter-spacing="0.5px">INTELLIGENCE &amp; ARCH</text>
    
    <!-- Role Divider -->
    <line x1="20" y1="66" x2="190" y2="66" stroke="#3b2d54" stroke-width="1"/>

    <!-- Highlights & Tasks -->
    <g font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
      <text x="20" y="94" font-weight="700" fill="#d8b4fe">Phase 2: Plan &amp; Critic</text>
      <text x="20" y="122">• Multi-tier Cost Routing</text>
      <text x="20" y="146">• Repo-grounded Critic</text>
      <text x="20" y="170">• [OKAY] Consensus Gate</text>
      <text x="20" y="194">• Digest Hash Signature</text>
    </g>

    <!-- Command Pill -->
    <rect x="16" y="230" width="178" height="34" rx="8" fill="#3b0764" stroke="#7e22ce" stroke-width="1"/>
    <text x="105" y="252" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#c084fc">jeo ralplan &amp; approve</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(492, 243)">
    <polygon points="0,0 12,7 0,14" fill="#c084fc"/>
  </g>

  <!-- ==================== STAGE 3: ENGINE CLAW ==================== -->
  <g transform="translate(510, 110)">
    <rect width="210" height="280" rx="18" fill="url(#engineGrad)" stroke="#f472b6" stroke-width="1.8" filter="drop-shadow(0 8px 16px rgba(244, 114, 182, 0.12))"/>
    <circle cx="34" cy="34" r="16" fill="#be185d" opacity="0.3"/>
    <text x="34" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">⚙️</text>
    <text x="60" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#fdf2f8">Engine Claw</text>
    <text x="60" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f472b6" letter-spacing="0.5px">PARALLEL EXECUTOR</text>
    
    <!-- Role Divider -->
    <line x1="20" y1="66" x2="190" y2="66" stroke="#4a1d3b" stroke-width="1"/>

    <!-- Highlights & Tasks -->
    <g font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
      <text x="20" y="94" font-weight="700" fill="#fbcfe8">Phase 3: Execution</text>
      <text x="20" y="122">• Git Worktree Fan-Out</text>
      <text x="20" y="146">• Content-Anchored Edits</text>
      <text x="20" y="170">• Cross-Process Lock</text>
      <text x="20" y="194">• Parent Mutation Audit</text>
    </g>

    <!-- Command Pill -->
    <rect x="16" y="230" width="178" height="34" rx="8" fill="#500724" stroke="#be185d" stroke-width="1"/>
    <text x="105" y="252" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#f472b6">jeo team --parallel</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(722, 243)">
    <polygon points="0,0 12,7 0,14" fill="#f472b6"/>
  </g>

  <!-- ==================== STAGE 4: NEWS CLAW ==================== -->
  <g transform="translate(740, 110)">
    <rect width="210" height="280" rx="18" fill="url(#newsGrad)" stroke="#2dd4bf" stroke-width="1.8" filter="drop-shadow(0 8px 16px rgba(45, 212, 191, 0.12))"/>
    <circle cx="34" cy="34" r="16" fill="#0f766e" opacity="0.3"/>
    <text x="34" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">📡</text>
    <text x="60" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f0fdfa">News Claw</text>
    <text x="60" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf" letter-spacing="0.5px">MONITOR &amp; RESEARCH</text>
    
    <!-- Role Divider -->
    <line x1="20" y1="66" x2="190" y2="66" stroke="#134e48" stroke-width="1"/>

    <!-- Highlights & Tasks -->
    <g font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
      <text x="20" y="94" font-weight="700" fill="#99f6e4">Phase 4: Telemetry</text>
      <text x="20" y="122">• Live State Broadcast</text>
      <text x="20" y="146">• Discord/Telegram/Slack</text>
      <text x="20" y="170">• External RAG &amp; Docs</text>
      <text x="20" y="194">• Subagent Edge Heartbeat</text>
    </g>

    <!-- Command Pill -->
    <rect x="16" y="230" width="178" height="34" rx="8" fill="#042f2e" stroke="#0f766e" stroke-width="1"/>
    <text x="105" y="252" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#2dd4bf">jeo daemon &amp; notify</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <g transform="translate(952, 243)">
    <polygon points="0,0 12,7 0,14" fill="#2dd4bf"/>
  </g>

  <!-- ==================== STAGE 5: ZERO CLAW ==================== -->
  <g transform="translate(970, 110)">
    <rect width="210" height="280" rx="18" fill="url(#zeroGrad)" stroke="#4ade80" stroke-width="1.8" filter="drop-shadow(0 8px 16px rgba(74, 222, 128, 0.12))"/>
    <circle cx="34" cy="34" r="16" fill="#15803d" opacity="0.3"/>
    <text x="34" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🛡️</text>
    <text x="60" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f0fdf4">Zero Claw</text>
    <text x="60" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4ade80" letter-spacing="0.5px">VERIFIER &amp; RELEASE</text>
    
    <!-- Role Divider -->
    <line x1="20" y1="66" x2="190" y2="66" stroke="#14532d" stroke-width="1"/>

    <!-- Highlights & Tasks -->
    <g font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
      <text x="20" y="94" font-weight="700" fill="#bbf7d0">Phase 5: Verification</text>
      <text x="20" y="122">• Honest Ultragoal Run</text>
      <text x="20" y="146">• Self-Correcting Repair</text>
      <text x="20" y="170">• Automated PR Creation</text>
      <text x="20" y="194">• Proof-Gated Completion</text>
    </g>

    <!-- Command Pill -->
    <rect x="16" y="230" width="178" height="34" rx="8" fill="#052e16" stroke="#15803d" stroke-width="1"/>
    <text x="105" y="252" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#4ade80">jeo ultragoal &amp; done</text>
  </g>

  <!-- Bottom Footer Status -->
  <g transform="translate(50, 420)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11.5" fill="#64748b">
      ✓ Fail-closed safety boundary · Deterministic state locks under <tspan fill="#94a3b8">.jeo/state/</tspan> · Zero fabricated test assertions
    </text>
    <text x="1100" y="0" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8">
      jeo-code v0.12 · Powered by Bun &amp; LLM Swarm
    </text>
  </g>
</svg>
